name: BilaScan static safety checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check assets/app.js
          node --check vendor/cvnss4.min.js
      - name: Check bundled scripts, CSP, simulation dataset and pinned codec
        run: node scripts/security-audit.mjs
      - name: Build Cloudflare Pages static output
        run: |
          node scripts/build-pages.mjs
          test -f dist/index.html
          test -f dist/_headers
          test -f dist/assets/app.js
          test -f dist/vendor/cvnss4.min.js
          test ! -e dist/.github
          test ! -e dist/scripts

